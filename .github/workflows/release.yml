name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify merged main
    uses: ./.github/workflows/ci.yml
    with:
      upload-build: true

  release:
    name: Semantic release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'ramiz4/riparim' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out exact merged commit and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Download verified build from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: worker-${{ github.sha }}
          path: artifacts
      - name: Create semantic GitHub release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

  deploy:
    name: Deploy published release to Cloudflare
    needs: release
    if: needs.release.outputs.released == 'true' && github.repository == 'ramiz4/riparim' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the released main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked deployment tools
        run: npm run install:ci
      - name: Download the published release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir -p artifacts
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "riparim-${RELEASE_TAG}.tar.gz" --output artifacts/riparim-worker.tar.gz
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "riparim-${RELEASE_TAG}.json" --output artifacts/provenance.json
      - name: Verify release, apply D1 migrations and deploy
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_SECRETS: ${{ secrets.CLOUDFLARE_WORKER_SECRETS }}
        run: npm run deploy:cloudflare
