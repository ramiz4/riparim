name: "Backup: Platform"
run-name: "Platform backup: ${{ github.ref_name }} / ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}"

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: platform-backup
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Back up auth configuration, D1 and R2
        env:
          CLOUDFLARE_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_BACKUP_TOKEN }}
          SUPABASE_AUTH_CONFIG_TOKEN: ${{ secrets.SUPABASE_AUTH_CONFIG_TOKEN }}
        run: python3 scripts/backup-platform.py "$RUNNER_TEMP/platform-backup"
      - name: Retain encrypted snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/platform-backup/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Remove runner copy
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/platform-backup"
