name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conventional_title:
    name: Conventional PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node <<'JS'
          const title = process.env.PR_TITLE ?? '';
          const convention = /^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9][a-z0-9/_-]*\))?!?: \S[^\r\n]*$/;
          if (!convention.test(title)) {
            console.error('Use a Conventional Commit PR title, e.g. fix(auth): validate callback redirects');
            process.exit(1);
          }
          console.log('PR title conforms to the repository Conventional Commit rules.');
          JS

  verify:
    name: Tests, types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Validate workshop catalogue
        run: npm run catalog:check
      - name: Test customer journeys and catalogue
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build Cloudflare Worker
        run: npm run build
        timeout-minutes: 10
