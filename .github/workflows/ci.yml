name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      upload-build:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm run install:ci
      - name: Set up Go for actual Auth email template rendering
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Validate workshop catalogue
        run: npm run catalog:check
      - name: Test customer journeys and catalogue
        run: npm test
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build Cloudflare Worker
        env:
          BUILD_TARGET: cloudflare
        run: npm run build
        timeout-minutes: 10
      - name: Package verified Worker
        run: npm run release:package
      - name: Build Sites companion from the same checked source
        env:
          BUILD_TARGET: sites
        run: |
          node -e 'require("node:fs").rmSync("dist", {recursive:true,force:true})'
          npm run build
        timeout-minutes: 10
      - name: Package verified Sites companion
        run: node scripts/package-release.mjs sites
      - name: Retain exact build for semantic release
        if: inputs.upload-build == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
